name: CI/CD - vivaeventos-proyecto

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**'
      - '.github/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '21'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm test
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage
      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-and-push:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-cloud-run:
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: projects/834797281102/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: cloud-run-admin@vivaeventos-498516.iam.gserviceaccount.com
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Pull from GHCR and push to Artifact Registry
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          docker pull ghcr.io/$REPO_LOWER:${{ github.ref_name }}
          docker tag ghcr.io/$REPO_LOWER:${{ github.ref_name }} \
            us-central1-docker.pkg.dev/vivaeventos-498516/cloud-run-images/vivaeventos-proyecto:${{ github.ref_name }}
          docker push us-central1-docker.pkg.dev/vivaeventos-498516/cloud-run-images/vivaeventos-proyecto:${{ github.ref_name }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522
        with:
          service: vivaeventos-proyecto
          image: us-central1-docker.pkg.dev/vivaeventos-498516/cloud-run-images/vivaeventos-proyecto:${{ github.ref_name }}
          region: us-central1
          env_vars: |
            GATEWAY_URL=${{ secrets.GATEWAY_URL }}
            DB_TICKETS_HOST=${{ secrets.DB_HOST }}
            DB_TICKETS_PORT=5432
            DB_TICKETS_DATABASE=vivaeventos_tickets
            DB_TICKETS_USER=${{ secrets.DB_USER }}
            DB_TICKETS_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_CHECKIN_HOST=${{ secrets.DB_HOST }}
            DB_CHECKIN_PORT=5432
            DB_CHECKIN_DATABASE=vivaeventos_checkin
            DB_CHECKIN_USER=${{ secrets.DB_USER }}
            DB_CHECKIN_PASSWORD=${{ secrets.DB_PASSWORD }}
