<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - VivaEventos</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <div class="auth-page">
        <div class="form-card">
            <div class="auth-header">
                <div class="logo">VivaEventos</div>
                <h3>Iniciar Sesión</h3>
                <p class="text-muted mt-2">Bienvenido de nuevo</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group mb-4">
                    <label for="email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="input w-full" 
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                
                <div class="input-group mb-4">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="input w-full" 
                        placeholder="••••••••"
                        required
                    >
                </div>
                
                <div class="flex justify-between items-center mb-4">
                    <label class="flex items-center gap-2" style="cursor: pointer;">
                        <input type="checkbox" name="remember">
                        <span class="text-sm text-secondary">Recordarme</span>
                    </label>
                    <a href="#" class="text-sm text-primary">¿Olvidaste tu contraseña?</a>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-full">
                        Iniciar Sesión
                    </button>
                </div>
            </form>
            
            <p class="text-center mt-6 text-muted text-sm">
                ¿No tienes cuenta? 
                <a href="registro.html" class="text-primary">Regístrate</a>
            </p>
        </div>
    </div>
    
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.querySelector('[name="remember"]').checked;
            
            try {
                const result = await AuthService.login(email, password, remember);
                if (result.success) {
                    AuthService.redirectByRole();
                } else {
                    alert(result.message || 'Error al iniciar sesión');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión con el servidor');
            }
        });
    </script>
</body>
</html>
