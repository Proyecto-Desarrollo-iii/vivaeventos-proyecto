<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - VivaEventos</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-bg-secondary) 100%);
            padding: var(--space-4);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }
        
        .auth-header .logo {
            display: inline-block;
            margin-bottom: var(--space-4);
        }
        
        .auth-header p {
            color: var(--color-text-secondary);
        }
        
        .role-selector {
            display: flex;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }
        
        .role-btn {
            flex: 1;
            padding: var(--space-3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: var(--color-bg);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-secondary);
        }
        
        .role-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        
        .role-btn.active {
            background: rgba(0, 151, 178, 0.1);
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        
        .form-actions {
            margin-top: var(--space-6);
        }
        
        .forgot-password {
            text-align: center;
            margin-top: var(--space-4);
            font-size: var(--font-size-sm);
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="form-card">
            <div class="auth-header">
                <div class="logo">VivaEventos</div>
                <h3>Iniciar Sesión</h3>
                <p class="text-muted mt-2">Bienvenido de nuevo</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group mb-4">
                    <label for="email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="input w-full" 
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                
                <div class="input-group mb-4">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="input w-full" 
                        placeholder="••••••••"
                        required
                    >
                </div>
                
                <div class="flex justify-between items-center mb-4">
                    <label class="flex items-center gap-2" style="cursor: pointer;">
                        <input type="checkbox" name="remember">
                        <span class="text-sm text-secondary">Recordarme</span>
                    </label>
                    <a href="#" class="text-sm text-primary">¿Olvidaste tu contraseña?</a>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-full">
                        Iniciar Sesión
                    </button>
                </div>
            </form>
            
            <p class="text-center mt-6 text-muted text-sm">
                ¿No tienes cuenta? 
                <a href="registro.html" class="text-primary">Regístrate</a>
            </p>
        </div>
    </div>
    
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/v1/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    if (data.user.role === 'admin' || data.user.role === 'organizador') {
                        window.location.href = '/admin/dashboard.html';
                    } else {
                        window.location.href = '/events/catalogo.html';
                    }
                } else {
                    alert(data.message || 'Error al iniciar sesión');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión');
            }
        });
    </script>
</body>
</html>
