<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - VivaEventos</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <div class="auth-page">
        <div class="form-card">
            <div class="auth-header">
                <div class="logo">VivaEventos</div>
                <h3>Iniciar Sesión</h3>
                <p class="text-muted mt-2">Bienvenido de nuevo</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group mb-4">
                    <label for="email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="input w-full" 
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                
                <div class="input-group mb-4">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="input w-full" 
                        placeholder="••••••••"
                        required
                    >
                </div>
                
                <div class="flex justify-between items-center mb-4">
                    <label class="flex items-center gap-2" style="cursor: pointer;">
                        <input type="checkbox" name="remember">
                        <span class="text-sm text-secondary">Recordarme</span>
                    </label>
                    <a href="#" class="text-sm text-primary">¿Olvidaste tu contraseña?</a>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-full">
                        Iniciar Sesión
                    </button>
                </div>
            </form>
            
            <p class="text-center mt-6 text-muted text-sm">
                ¿No tienes cuenta? 
                <a href="registro.html" class="text-primary">Regístrate</a>
            </p>
        </div>
    </div>
    
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // ============================================
            // MODO DE PRUEBA: Login sin servidor
            // ============================================
            console.log('⚠️ Modo de prueba: Simulando login...');
            
            const mockUser = {
                id: 1,
                name: 'Usuario de Prueba',
                email: email,
                role: 'usuario'
            };
            localStorage.setItem('token', 'mock-token-12345');
            localStorage.setItem('user', JSON.stringify(mockUser));
            
            alert('Login simulado exitoso. Redirigiendo...');
            window.location.href = '/index.html';
            // ============================================
            // FIN MODO DE PRUEBA
            // ============================================
            
            /*

                });

                if (response.ok) {
                    localStorage.setItem('token', data.token);

                    window.location.href = '/index.html';
                } else {
                    alert(data.message || 'Error al iniciar sesión');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión');
            }
            */
        });
    </script>
</body>
</html>
