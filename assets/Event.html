<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi cuenta | VivaEventos</title>
    <link rel="icon" href="/assets/images/Logoblue.png">
    <link rel="stylesheet" href="/assets/css/landingpage.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/Myaccount.css">
    <link rel="stylesheet" href="/assets/css/Event.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>
    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <!-- HERO -->
    <div class="event-hero">
        <img id="event-image" src="" alt="Evento">
    </div>

    <section id="event-detail" class="event-detail">

        <!-- INFO PRINCIPAL -->
        <div class="event-main-info">
            <button class="btn btn-primary">Venta general</button>

            <h1 id="event-title"></h1>
            <p id="event-location"></p>
        </div>

        <!-- NAV -->
        <div class="event-nav">
            <a href="#about">Acerca de</a>
            <a href="#map">Mapa y precios</a>
            <a href="#how">¿Cómo llegar?</a>
            <a href="#listen">Escúchalo</a>
            <a href="#terms">Términos</a>
        </div>

        <!-- CONTENIDO -->

        <section id="about" class="event-section">
            <h2>Acerca del evento</h2>
            <p id="event-description"></p>
        </section>

        <section id="map" class="event-section">
            <h2>Mapa y precios</h2>
            <img src="https://cdn.getcrowder.com/images/9cde494b-933f-4bc7-baf5-3b839e47d862-mapa-precios-desktop.png" class="event-map">
        </section>

        <div class="listen-map-row">
            <section id="how" class="event-section">
                <h2>¿Cómo llegar?</h2>
                <div class="map-container">
                    <iframe id="event-map-iframe" class="map-iframe" loading="lazy"></iframe>
                    <a id="maps-link" target="_blank" class="maps-link">
                        <span class="material-symbols-outlined">location_on</span>
                        <span id="venue-name"></span>
                        <span class="maps-link-text">Ver en Google Maps</span>
                    </a>
                </div>
            </section>

            <section id="listen" class="event-section">
                <h2>Escúchalo</h2>
                <div class="spotify-embed-container">
                    <iframe id="spotify-embed" style="border-radius:12px" src="" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </section>
        </div>

        <section id="terms" class="event-section">
            <h2>Términos y condiciones</h2>
            <ul>
                <li>Entrada válida solo con Ticketmaster</li>
                <li>No reembolsable</li>
            </ul>
        </section>

    </section>

    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/navbar.js"></script>
    <script src="/assets/js/Event.js"></script>
</body>

</html>
